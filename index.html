<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 동아리 부스 기획실</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18253d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#243b65;color:white;padding:20px}main{max-width:1080px;margin:auto;padding:22px}.card{background:white;border:1px solid #e1e6ef;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #1e32500a}h1{margin:0;font-size:24px}h2{font-size:19px}button{background:#3659a3;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;margin:4px}button.secondary{background:#e9eef8;color:#243b65}button:disabled{opacity:.5}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin:6px 0 12px;font:inherit}textarea{min-height:85px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#607086;font-size:14px}.pill{background:#eaf0fa;border-radius:100px;padding:5px 10px;display:inline-block}.hidden{display:none}.idea{border:1px solid #dce3ee;border-radius:12px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}label{font-weight:650}hr{border:0;border-top:1px solid #e5e9f0;margin:20px 0}.warning{background:#fff6df;padding:12px;border-radius:10px}small{color:#607086}#notice{font-weight:650;color:#246448}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e6eaf0;padding:9px;text-align:left}</style></head><body><header><div class="top"><h1>우리 동아리 부스 기획실</h1><span id="status">연결 설정 전</span></div></header><main><section id="landing" class="card"><h2>회의에 참여해 주세요</h2><p class="muted">19명 전체 토론 · 50분 회의 · 개인 의견부터 최종 운영 계획까지</p><div class="grid"><button onclick="show('studentLogin')">학생용 입장</button><button class="secondary" onclick="show('teacherLogin')">교사용 입장</button></div></section><section id="studentLogin" class="card hidden"><h2>학생 접속</h2><label>5자리 학번</label><input id="studentId" maxlength="5" inputmode="numeric" placeholder="예: 10501"><button onclick="studentEnter()">참여하기</button><button class="secondary" onclick="show('landing')">뒤로</button></section><section id="teacherLogin" class="card hidden"><h2>교사 로그인</h2><p class="muted">Firebase Authentication에 등록된 교사 이메일 계정으로 로그인합니다.</p><input id="teacherEmail" type="email" placeholder="교사 이메일"><input id="teacherPassword" type="password" placeholder="비밀번호"><button onclick="teacherEnter()">로그인</button><button class="secondary" onclick="show('landing')">뒤로</button></section><section id="student" class="hidden"><div class="card top"><div><h2>학생 회의실</h2><span id="studentStep" class="pill"></span></div><button class="secondary" onclick="logout()">나가기</button></div><div id="studentContent"></div></section><section id="teacher" class="hidden"><div class="card top"><div><h2>교사 대시보드</h2><span id="teacherStep" class="pill"></span></div><button class="secondary" onclick="logout()">로그아웃</button></div><div class="card"><h3>회의 단계 제어</h3><div id="stepButtons"></div><p class="muted">단계를 변경하면 학생 화면에도 반영됩니다.</p><label>후보 아이디어 ID (쉼표로 구분)</label><input id="candidateIds" placeholder="아이디어 카드에 표시된 ID"><button onclick="setCandidates()">후보 확정</button><button class="secondary" onclick="toggleVoting()" id="voteToggle">투표 종료/시작</button></div><div class="card"><h3>제출 현황 및 아이디어</h3><div id="teacherStats"></div><div id="teacherIdeas"></div></div><div class="card"><h3>최종 결정 기록</h3><label>결정 항목</label><select id="decisionKey"><option value="theme">부스 주제</option><option value="operation">운영 방식</option><option value="promotion">홍보</option><option value="materials">준비물</option><option value="budget">예산</option><option value="roles">운영 인원 및 타임</option><option value="place">장소</option><option value="effects">기대효과</option></select><textarea id="decisionText" placeholder="토론에서 확정한 내용"></textarea><button onclick="saveDecision()">결정 저장</button><button class="secondary" onclick="exportPlan()">계획서 텍스트 저장</button><div id="decisions"></div></div></section><p id="notice"></p></main><script type="module">
// Firebase 프로젝트 생성 후 아래 설정값을 채우세요.
const firebaseConfig={apiKey:'',authDomain:'',projectId:'',appId:''};
const steps=['아이디어 제안','아이디어 공유 및 발전','평가 및 최종 선정','세부 운영 계획','최종 확인'];
let db,auth,api,uid='',role='',state={step:0,candidates:[],votingOpen:false,decisions:{}},ideas=[],responses=[],votes=[],unsubscribe=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const note=s=>{$('notice').textContent=s;setTimeout(()=>{$('notice').textContent=''},5000)};
window.show=id=>{['landing','studentLogin','teacherLogin','student','teacher'].forEach(x=>$(x).classList.toggle('hidden',x!==id))};
if(firebaseConfig.apiKey&&firebaseConfig.projectId){try{const app=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');const fs=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');const au=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');db=fs.getFirestore(app.initializeApp(firebaseConfig));auth=au.getAuth();api={...fs,...au};$('status').textContent='Firebase 연결 준비';}catch(e){$('status').textContent='연결 오류';note(e.message)}}else{$('status').textContent='Firebase 설정 필요'}
async function ensureAuth(){if(!api)throw Error('Firebase 설정값을 먼저 입력하세요.');if(!auth.currentUser)await api.signInAnonymously(auth)}
function watch(){unsubscribe.forEach(f=>f());unsubscribe=[];unsubscribe.push(api.onSnapshot(api.doc(db,'config','meeting'),s=>{state={step:0,candidates:[],votingOpen:false,decisions:{},...(s.data()||{})};render()}));unsubscribe.push(api.onSnapshot(api.collection(db,'ideas'),s=>{ideas=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubscribe.push(api.onSnapshot(api.collection(db,'responses'),s=>{responses=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubscribe.push(api.onSnapshot(api.collection(db,'votes'),s=>{votes=s.docs.map(d=>({id:d.id,...d.data()}));render()}))}
window.studentEnter=async()=>{let v=$('studentId').value.trim();if(!/^\d{5}$/.test(v))return note('학번 5자리를 입력해 주세요.');try{await ensureAuth();uid=v;role='student';show('student');watch()}catch(e){note(e.message)}};
window.teacherEnter=async()=>{try{if(!api)throw Error('Firebase 설정이 필요합니다.');const result=await api.signInWithEmailAndPassword(auth,$('teacherEmail').value,$('teacherPassword').value);const allow=await api.getDoc(api.doc(db,'teachers',result.user.uid));if(!allow.exists())throw Error('교사 권한이 등록되지 않았습니다.');role='teacher';show('teacher');watch()}catch(e){note(e.message)}};
window.logout=async()=>{unsubscribe.forEach(f=>f());unsubscribe=[];role='';uid='';if(auth)await api.signOut(auth);show('landing')};
async function add(collection,data,id){try{await api.setDoc(api.doc(db,collection,id||crypto.randomUUID()),{...data,updatedAt:api.serverTimestamp()},{merge:true});note('저장했어요.')}catch(e){note('저장 실패: '+e.message)}}
window.submitIdea=()=>{const name=$('ideaName').value.trim(),activity=$('ideaActivity').value.trim(),reason=$('ideaReason').value.trim();if(!name||!activity||!reason)return note('세 항목을 모두 작성해 주세요.');add('ideas',{studentId:uid,name,activity,reason},uid)};
window.submitFeedback=id=>{const text=$('feedback_'+id).value.trim();if(!text)return note('의견을 입력해 주세요.');add('responses',{studentId:uid,type:'feedback',ideaId:id,text},'feedback_'+uid+'_'+id)};
window.submitVote=()=>{const id=$('voteChoice').value;if(!id)return note('후보를 선택하세요.');add('votes',{studentId:uid,ideaId:id},uid)};
window.submitPlan=()=>{const type=$('planType').value,text=$('planText').value.trim();if(!text)return note('의견을 입력해 주세요.');add('responses',{studentId:uid,type:'plan',topic:type,text},'plan_'+uid+'_'+type)};
window.setStep=async i=>{await add('config',{step:i},'meeting')};
window.setCandidates=async()=>{const ids=$('candidateIds').value.split(',').map(s=>s.trim()).filter(s=>ideas.some(x=>x.id===s));await add('config',{candidates:ids,votingOpen:false},'meeting')};
window.toggleVoting=async()=>{await add('config',{votingOpen:!state.votingOpen},'meeting')};
window.saveDecision=async()=>{const k=$('decisionKey').value,v=$('decisionText').value.trim();if(!v)return note('결정 내용을 입력해 주세요.');await add('config',{decisions:{...state.decisions,[k]:v}},'meeting')};
window.exportPlan=()=>{const labels={theme:'주제(테마)',operation:'운영 계획',promotion:'홍보 방식',materials:'필요 물품',budget:'예산',roles:'운영 학생 명단',place:'희망 장소',effects:'기대효과'};const text=['동아리 발표회 운영 계획서 - 회의 결과',...Object.entries(labels).map(([k,v])=>v+'\n'+(state.decisions[k]||'미정'))].join('\n\n');const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='동아리_회의_결과.txt';a.click();URL.revokeObjectURL(url)};
function render(){if(!role)return;const step=Math.max(0,Math.min(4,state.step||0));$('studentStep').textContent=steps[step];$('teacherStep').textContent=steps[step];if(role==='student'){const mine=ideas.find(x=>x.studentId===uid);let html='';if(step===0)html=`<div class="card"><h2>내 부스 아이디어 제안</h2><label>부스 이름</label><input id="ideaName" value="${esc(mine?.name||'')}"><label>방문객 체험 내용</label><textarea id="ideaActivity">${esc(mine?.activity||'')}</textarea><label>추천 이유</label><textarea id="ideaReason">${esc(mine?.reason||'')}</textarea><button onclick="submitIdea()">아이디어 저장</button></div>`;if(step===1)html='<div class="card"><h2>아이디어 공유 및 피드백</h2><p class="muted">각 아이디어의 장점과 개선할 점을 적어주세요.</p>'+ideas.map(x=>`<div class="idea"><b>${esc(x.name)}</b><p>${esc(x.activity)}</p><small>${esc(x.reason)}</small><textarea id="feedback_${esc(x.id)}" placeholder="좋은 점과 개선 제안"></textarea><button onclick="submitFeedback('${esc(x.id)}')">의견 저장</button></div>`).join('')+'</div>';if(step===2)html=`<div class="card"><h2>최종 부스 선정</h2><p>후보를 검토하고 한 가지를 선택해 주세요.</p><select id="voteChoice">${(state.candidates||[]).map(id=>ideas.find(x=>x.id===id)).filter(Boolean).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button onclick="submitVote()" ${!state.votingOpen?'disabled':''}>투표 제출</button><p class="muted">${state.votingOpen?'투표 진행 중':'교사가 투표를 열면 참여할 수 있습니다.'}</p></div>`;if(step===3)html=`<div class="card"><h2>운영 계획 의견 제출</h2><label>논의 주제</label><select id="planType">${['체험 순서','홍보','공간 구성','준비물','예산','역할 분담','안전 및 혼잡 대비','기대효과'].map(x=>`<option>${x}</option>`).join('')}</select><textarea id="planText" placeholder="실제로 실행할 수 있는 방법을 구체적으로 적어주세요."></textarea><button onclick="submitPlan()">의견 저장</button></div>`;if(step===4)html='<div class="card"><h2>우리의 최종 결정</h2>'+decisionHtml()+'</div>';$('studentContent').innerHTML=html;return}
$('stepButtons').innerHTML=steps.map((s,i)=>`<button class="${i===step?'':'secondary'}" onclick="setStep(${i})">${i+1}. ${s}</button>`).join('');$('teacherStats').innerHTML=`<p>아이디어 ${ideas.length}건 · 피드백 ${responses.filter(x=>x.type==='feedback').length}건 · 운영 의견 ${responses.filter(x=>x.type==='plan').length}건 · 투표 ${votes.length}건</p>`;$('teacherIdeas').innerHTML=ideas.map(x=>`<div class="idea"><b>${esc(x.name)}</b> <small>학번 ${esc(x.studentId)} / ID: ${esc(x.id)}</small><p>${esc(x.activity)} — ${esc(x.reason)}</p><small>피드백: ${responses.filter(r=>r.type==='feedback'&&r.ideaId===x.id).map(r=>esc(r.text)).join(' / ')||'없음'}</small></div>`).join('')+'<h3>운영 계획 의견</h3>'+responses.filter(x=>x.type==='plan').map(x=>`<p><b>${esc(x.topic)}</b> (${esc(x.studentId)}): ${esc(x.text)}</p>`).join('')+'<h3>투표 집계 (교사용)</h3>'+ideas.map(x=>`<p>${esc(x.name)}: ${votes.filter(v=>v.ideaId===x.id).length}표</p>`).join('');$('decisions').innerHTML=decisionHtml();$('voteToggle').textContent=state.votingOpen?'투표 종료':'투표 시작'}
function decisionHtml(){const labels={theme:'부스 주제',operation:'체험 및 운영 방식',promotion:'홍보 방식',materials:'필요 물품',budget:'예산',roles:'운영 학생 명단',place:'희망 장소',effects:'기대효과'};return Object.entries(labels).map(([k,v])=>`<p><b>${v}</b><br>${esc(state.decisions?.[k]||'미정')}</p>`).join('')}
</script></body></html>
